<!DOCTYPE html>
<html>
<head>
    <title>Audio Anomaly Dashboard</title>
</head>
<body>

<h2>Industrial Audio Monitoring Dashboard</h2>

<div>
    <p>Total Clips: <span id="total"></span></p>
    <p>Anomalies: <span id="anomalies"></span></p>
    <p>Normal: <span id="normal"></span></p>
    <p>Avg Probability: <span id="avg"></span></p>
</div>

<h3>Recent Predictions</h3>
<table border="1">
    <thead>
        <tr>
            <th>Probability</th>
            <th>Classification</th>
            <th>Size (KB)</th>
            <th>Timestamp</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<script>
async function refreshDashboard() {

    const summaryRes = await fetch("http://localhost:8000/dashboard/summary");
    const summary = await summaryRes.json();

    document.getElementById("total").innerText = summary.total_clips;
    document.getElementById("anomalies").innerText = summary.anomalies;
    document.getElementById("normal").innerText = summary.normal;
    document.getElementById("avg").innerText = summary.average_probability;

    const recentRes = await fetch("http://localhost:8000/dashboard/recent");
    const recent = await recentRes.json();

    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    recent.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${row.probability.toFixed(3)}</td>
            <td>${row.classification}</td>
            <td>${row.size_kb || "-"}</td>
            <td>${row.timestamp || "-"}</td>
        `;
        tbody.appendChild(tr);
    });
}

setInterval(refreshDashboard, 3000);
refreshDashboard();
</script>

</body>
</html>
