<!DOCTYPE html>
<html>
<head>
    <title>Upload Multiple Audio Clips</title>
</head>
<body>

<h2>Upload Multiple 10s Audio Clips</h2>

<input type="file" id="audioFiles" multiple accept="audio/*">
<button onclick="uploadClips()">Upload</button>

<p id="status"></p>

<script>
async function uploadClips() {
    const files = document.getElementById("audioFiles").files;

    if (files.length === 0) {
        alert("Select files first");
        return;
    }

    const formData = new FormData();
    for (let i = 0; i < files.length; i++) {
        formData.append("files", files[i]);
    }

    document.getElementById("status").innerText = "Uploading...";

    const response = await fetch("http://localhost:8000/upload_clips", {
        method: "POST",
        body: formData
    });

    const data = await response.json();

    document.getElementById("status").innerText =
        "Uploaded " + data.count + " clips successfully.";
}
</script>

</body>
</html>
