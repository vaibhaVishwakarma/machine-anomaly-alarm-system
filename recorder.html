<!DOCTYPE html>
<html>
<head>
    <title>Upload Audio File</title>
</head>
<body>

<h2>Upload Audio File (Stream in 10s Chunks)</h2>

<input type="file" id="fileInput" accept="audio/*" />
<button id="uploadBtn">Start Streaming</button>

<p id="status">Idle</p>

<script>
const uploadBtn = document.getElementById("uploadBtn");
const fileInput = document.getElementById("fileInput");
const status = document.getElementById("status");

uploadBtn.onclick = async () => {

    const file = fileInput.files[0];

    if (!file) {
        status.innerText = "Select a file first.";
        return;
    }

    status.innerText = "Uploading...";

    const formData = new FormData();
    formData.append("audio", file);

    const response = await fetch("http://127.0.0.1:5000/upload_stream", {
        method: "POST",
        body: formData
    });

    const result = await response.json();

    status.innerText = result.status;
};
</script>

</body>
</html>
