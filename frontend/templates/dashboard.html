<!DOCTYPE html>
<html>
<head>
    <title>Streaming Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        /* ---------------- TOP ROW ---------------- */

        .top-row {
            display: flex;
            gap: 30px;
            align-items: stretch;
            flex-wrap: wrap;
        }

        .inference-card {
            flex: 2;
            min-width: 500px;
            display: flex;
            flex-direction: column;
        }

        .status-card {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
        }

        /* ---------------- MACHINE NAVBAR ---------------- */

        .machine-navbar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .machine-badge {
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            color: white;
            font-size: 14px;
            text-align: center;
        }

        /* ---------------- BOTTOM ROW ---------------- */

        .responsive-row {
            display: flex;
            gap: 30px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .throughput-box {
            flex: 2;
            min-width: 300px;
        }

        .circle-container {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 10px solid #007bff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            background: #eef5ff;
        }

        @media (max-width: 900px) {
            .top-row, .responsive-row {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<h2>Real-Time Monitoring Dashboard</h2>

<!-- ================= TOP SECTION ================= -->
<div class="top-row">

    <div class="card inference-card">
        <h3>Last 150 Seconds Results</h3>
        <canvas id="resultChart"></canvas>
    </div>

    <div class="card status-card">
        <h3>Machine Status</h3>
        <div id="machineNavbar" class="machine-navbar"></div>
    </div>

</div>

<!-- ================= BOTTOM SECTION ================= -->
<div class="card responsive-row">

    <div class="throughput-box">
        <h3>Data Throughput (KB/sec)</h3>
        <canvas id="dataChart"></canvas>
    </div>

    <div class="circle-container">
        <h3>Total Data Used</h3>
        <div class="circle" id="totalDataCircle">0 KB</div>
    </div>

</div>

<script>

const WINDOW_SECONDS = 150;

const resultCtx = document.getElementById("resultChart");
const dataCtx = document.getElementById("dataChart");

const resultChart = new Chart(resultCtx, {
    type: 'bar',
    data: {
        labels: [],
        datasets: [{
            label: 'Inference Result',
            data: [],
            backgroundColor: []
        }]
    },
    options: {
        scales: {
            y: {
                min: 0,
                max: 2,
                ticks: {
                    stepSize: 1,
                    callback: function(value) {
                        if (value === 1) return "NORMAL";
                        if (value === 2) return "ANOMALY";
                        return "";
                    }
                }
            }
        }
    }
});

const dataChart = new Chart(dataCtx, {
    type: 'line',
    data: {
        labels: [],
        datasets: [{
            label: 'KB per Inference',
            data: [],
            borderColor: '#007bff',
            tension: 0.3
        }]
    },
    options: {
        scales: {
            y: { beginAtZero: true }
        }
    }
});

async function updateDashboard() {

    const res1 = await fetch("/predictions");
    const predictions = await res1.json();

    const res2 = await fetch("/sequence_status");
    const seqStatus = await res2.json();

    const res3 = await fetch("/machine_states");
    const states = await res3.json();

    updateMachineNavbar(predictions, states);
    updateResultChart(predictions);
    updateDataChart(predictions);
    updateTotalData(seqStatus.total_bytes);
}

function updateMachineNavbar(predictions, states) {

    const container = document.getElementById("machineNavbar");
    container.innerHTML = "";

    const now = Date.now() / 1000;

    const activePredictions = predictions.filter(
        p => now - p.timestamp <= WINDOW_SECONDS
    );

    const activeMachines = [...new Set(
        activePredictions.map(p => p.machine_id)
    )];

    activeMachines.forEach(machineId => {

        const badge = document.createElement("div");
        badge.className = "machine-badge";
        badge.innerText = "Machine " + machineId;

        if (states[String(machineId)] === "ALARM") {
            badge.style.backgroundColor = "#dc3545";
        } else {
            badge.style.backgroundColor = "#28a745";
        }

        container.appendChild(badge);
    });
}

function updateResultChart(predictions) {

    const now = Date.now() / 1000;

    const lastWindow = predictions.filter(
        p => now - p.timestamp <= WINDOW_SECONDS
    );

    const labels = [];
    const data = [];
    const colors = [];

    lastWindow.forEach(p => {

        labels.push(new Date(p.timestamp * 1000).toLocaleTimeString());

        if (p.prediction === "ANOMALY") {
            data.push(2);
            colors.push("#dc3545");
        } else {
            data.push(1);
            colors.push("#28a745");
        }
    });

    resultChart.data.labels = labels;
    resultChart.data.datasets[0].data = data;
    resultChart.data.datasets[0].backgroundColor = colors;
    resultChart.update();
}

function updateDataChart(predictions) {

    const now = Date.now() / 1000;

    const lastWindow = predictions.filter(
        p => now - p.timestamp <= WINDOW_SECONDS
    );

    const labels = [];
    const data = [];

    lastWindow.forEach(p => {
        labels.push(new Date(p.timestamp * 1000).toLocaleTimeString());
        data.push(p.size_kb || 0);
    });

    dataChart.data.labels = labels;
    dataChart.data.datasets[0].data = data;
    dataChart.update();
}

function updateTotalData(totalBytes) {
    const kb = (totalBytes / 1024).toFixed(1);
    document.getElementById("totalDataCircle").innerText = kb + " KB";
}

setInterval(updateDashboard, 2000);

</script>

</body>
</html>
