<!DOCTYPE html>
<html>
<head>
    <title>Timed Audio Upload</title>
</head>
<body>

<h2>Upload 10s Audio Files (5s interval)</h2>

<input type="file" id="files" multiple accept=".wav">
<br><br>

<button onclick="startUpload()">Start Sequence</button>

<p id="status"></p>

<script>

let fileQueue = [];
let index = 0;

function startUpload() {

    const input = document.getElementById("files");
    fileQueue = Array.from(input.files);

    if (fileQueue.length === 0) {
        alert("Select files first");
        return;
    }

    index = 0;
    document.getElementById("status").innerText =
        "Uploading " + fileQueue.length + " files...";

    uploadNext();
}

function uploadNext() {

    if (index >= fileQueue.length) {
        document.getElementById("status").innerText =
            "Upload sequence completed.";
        return;
    }

    const formData = new FormData();
    formData.append("files", fileQueue[index]);

    fetch("/upload", {
        method: "POST",
        body: formData
    });

    document.getElementById("status").innerText =
        "Sent: " + fileQueue[index].name;

    index++;

    setTimeout(uploadNext, 5000);  // 5 seconds interval
}

</script>

</body>
</html>
